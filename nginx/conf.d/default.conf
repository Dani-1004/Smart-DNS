# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen 443 ssl;
    
    server_name landing.block.com;

    ssl_certificate     /etc/ssl/localhost.crt;
    ssl_certificate_key /etc/ssl/localhost.key;

    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}
